---
- name: Prepare k3s nodes
  hosts: k3s_cluster2
  gather_facts: yes
  roles:
    - role: prereq
      become: true
    - role: download
      become: true

- name: Setup k3s servers
  hosts: master
  roles:
    - role: k3s_server
      become: true

- name: Setup k3s agents
  hosts: node
  roles:
    - role: k3s_agent
      become: true

- name: Cleanup
  hosts: master
  become: true
  tasks:
  - name: Remove tmp directory used for manifests
    file:
      path: /tmp/k3s
      state: absent
